name: Verify historical 3.2.0-rc.1 prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plexonpanel-3.2.0-rc.1-history
  cancel-in-progress: false
jobs:
  verify-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable historical RC1 boundary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v3.2.0-rc.1
          EXPECTED_SHA: ccac7e4b3ae15f876d5653fbeda462cea1dbcdf1
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          target="$(jq -r .target_commitish <<<"$release_json")"
          prerelease="$(jq -r .prerelease <<<"$release_json")"
          test "$target" = "$EXPECTED_SHA"
          test "$prerelease" = "true"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          test "$tag_sha" = "$EXPECTED_SHA"
          echo "Historical ${RELEASE_TAG} remains unchanged at ${EXPECTED_SHA}."
