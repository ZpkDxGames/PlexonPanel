name: Publish PlexonPanel 3.1.1 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-3.1.1-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  '"$core_jar" | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Build and package exact merged source
        run: |
          ./gradlew --no-daemon clean test check javadoc :agent:jar :host-agent:jar
          python3 scripts/package-release.py
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -s build/release/PlexonPanel-3.1.1.jar
          test -s build/release/plexonpanel-host-3.1.1.jar
          (cd build/release && sha256sum --check SHA256SUMS.txt)
          jar tf build/release/PlexonPanel-3.1.1.jar > build/release/paper-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/release/paper-contents.txt; then exit 1; fi
          unzip -p build/release/PlexonPanel-3.1.1.jar plugin.yml | grep -F 'version: "3.1.1"'
      - name: Publish immutable v3.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.1.1 >/dev/null 2>&1; then
            echo 'v3.1.1 already exists; refusing to replace immutable release assets.' >&2
            exit 1
          fi
          gh release create v3.1.1 \
            build/release/PlexonPanel-3.1.1.jar \
            build/release/plexonpanel-host-3.1.1.jar \
            build/release/PlexonPanel-3.1.1-examples.zip \
            build/release/release-manifest.json \
            build/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'PlexonPanel 3.1.1' --notes-file docs/release-3.1.1.md
