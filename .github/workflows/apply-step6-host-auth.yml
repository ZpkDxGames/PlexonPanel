name: Apply Step 6 host authorization decoupling

on:
  push:
    branches: [agent/step6-host-authorization-decoupling]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step6-host-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Normalize current-source status anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply-step6-host-auth.py")
          text = p.read_text()
          start = text.index("replace_count(\n    host_main,\n    '            status.put")
          end = text.index("\n\n# Host never mutates", start)
          replacement = '''replace_count(
              host_main,
              '            status.put("paperConnected", paper.get());\\n',
              '            status.put("paperConnected", paper.get());\\n            status.put("authorizationMirror", authorization.status());\\n',
              2,
          )'''
          p.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Apply Step 6 source transformation
        run: python3 scripts/apply-step6-host-auth.py

      - name: Test and build backend pair
        id: validate
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon clean test check javadoc :agent:jar :host-agent:jar > step6-backend-validation.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo
              echo '===== HOST-AGENT TEST XML ====='
              find host-agent/build/test-results/test -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
              echo
              echo '===== PROTOCOL TEST XML ====='
              find protocol/build/test-results/test -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
            } >> step6-backend-validation.log
          fi
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          tail -n 400 step6-backend-validation.log
          exit 0

      - name: Upload backend validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: step6-backend-validation
          path: step6-backend-validation.log
          if-no-files-found: error
          retention-days: 2

      - name: Enforce backend validation result
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

      - name: Commit validated transformation
        if: steps.validate.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f step6-backend-validation.log
          git checkout -- scripts/apply-step6-host-auth.py
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Decouple Host authorization from Paper runtime"
          git push origin HEAD:agent/step6-host-authorization-decoupling
