name: Agent Step 8 RCON cadence remediation

on:
  push:
    branches:
      - fix/step8-rcon-readiness-cadence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply cached readiness implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          host = Path("host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java")
          text = host.read_text()

          def once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"HostMain: expected one target, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          once(
              "    AtomicBoolean paper = new AtomicBoolean();",
              "    AtomicBoolean paper = new AtomicBoolean();\n    MinecraftReadinessCache minecraftReadiness = new MinecraftReadinessCache(commands);",
          )
          once(
              "() -> commands.readinessProbe().success(),",
              "minecraftReadiness::probeNow,",
          )
          once(
              '                  result.put("commandChannelConfigured", commands.enabled());',
              '                  result.put("commandChannelConfigured", commands.enabled());\n'
              '                  Map<String, Object> serviceStatus = service.status();\n'
              '                  result.put(\n'
              '                      "minecraftReady",\n'
              '                      minecraftReadiness.refresh(\n'
              '                          "active".equals(serviceStatus.get("state"))));',
          )

          ready_line = 'status.put("minecraftReady", commands.readinessProbe().success());'
          ready_count = text.count(ready_line)
          if ready_count != 2:
              raise SystemExit(f"HostMain: expected two passive readiness probes, found {ready_count}")
          text = text.replace(
              ready_line,
              'status.put(\n'
              '                      "minecraftReady",\n'
              '                      minecraftReadiness.observeServiceState(\n'
              '                          "active".equals(status.get("state"))));',
          )

          once(
              "                      waitStopped(service, commands, 180);",
              "                      waitStopped(service, commands, 180);\n                      minecraftReadiness.markStopped();",
          )
          once(
              "                          service, commands, config.commandChannel().readinessTimeoutSeconds());",
              "                          service, commands, config.commandChannel().readinessTimeoutSeconds());\n                      minecraftReadiness.markStarted();",
          )
          host.write_text(text)

          Path("host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCache.java").write_bytes(base64.b64decode(""))
          Path("host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCacheTest.java").write_bytes(base64.b64decode(""))
          PY
      - name: Commit remediation for normal Build CI
        shell: bash
        run: |
          git config user.name "PlexonPanel Agent"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git add host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java \
                  host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCache.java \
                  host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCacheTest.java
          git diff --cached --check
          git commit -m "[agent-patch] Cache passive RCON readiness"
          git push origin HEAD:${GITHUB_REF_NAME}
