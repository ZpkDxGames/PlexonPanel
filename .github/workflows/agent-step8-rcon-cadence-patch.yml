name: Agent Step 8 RCON cadence remediation

on:
  push:
    branches:
      - fix/step8-rcon-readiness-cadence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply cached readiness implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          host = "host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java"

          replace_once(
              host,
              '''    MinecraftCommandChannel commands = new RconMinecraftCommandChannel(config.commandChannel());
              AtomicBoolean paper = new AtomicBoolean();
              ReentrantLock operationLock = new ReentrantLock();''',
              '''    MinecraftCommandChannel commands = new RconMinecraftCommandChannel(config.commandChannel());
              AtomicBoolean paper = new AtomicBoolean();
              MinecraftReadinessCache minecraftReadiness = new MinecraftReadinessCache(commands);
              ReentrantLock operationLock = new ReentrantLock();''',
          )

          replace_once(
              host,
              '''            service,
                          () -> commands.readinessProbe().success(),
                          operationLock,''',
              '''            service,
                          minecraftReadiness::probeNow,
                          operationLock,''',
          )

          replace_once(
              host,
              '''                  result.put("commandChannelConfigured", commands.enabled());
                          result.put("hostStartedAt", hostStartedAt.toString());''',
              '''                  result.put("commandChannelConfigured", commands.enabled());
                          Map<String, Object> serviceStatus = service.status();
                          result.put(
                              "minecraftReady",
                              minecraftReadiness.refresh(
                                  "active".equals(serviceStatus.get("state"))));
                          result.put("hostStartedAt", hostStartedAt.toString());''',
          )

          replace_once(
              host,
              '''                  status.put("commandChannelConfigured", commands.enabled());
                          status.put("minecraftReady", commands.readinessProbe().success());
                          status.put("recoveryRequired", fullBackups.recoveryRequired());''',
              '''                  status.put("commandChannelConfigured", commands.enabled());
                          status.put(
                              "minecraftReady",
                              minecraftReadiness.observeServiceState(
                                  "active".equals(status.get("state"))));
                          status.put("recoveryRequired", fullBackups.recoveryRequired());''',
          )

          replace_once(
              host,
              '''                      service.action("stop");
                              waitStopped(service, commands, 180);
                            }
                            if (!action.equals("server.stop")) {''',
              '''                      service.action("stop");
                              waitStopped(service, commands, 180);
                              minecraftReadiness.markStopped();
                            }
                            if (!action.equals("server.stop")) {''',
          )

          replace_once(
              host,
              '''                      waitStarted(
                                  service, commands, config.commandChannel().readinessTimeoutSeconds());
                            }
                            return Map.of(''',
              '''                      waitStarted(
                                  service, commands, config.commandChannel().readinessTimeoutSeconds());
                              minecraftReadiness.markStarted();
                            }
                            return Map.of(''',
          )

          replace_once(
              host,
              '''            status.put("authorizationMirror", authorization.status());
                        status.put("minecraftReady", commands.readinessProbe().success());
                        status.put("recoveryRequired", fullBackups.recoveryRequired());''',
              '''            status.put("authorizationMirror", authorization.status());
                        status.put(
                            "minecraftReady",
                            minecraftReadiness.observeServiceState(
                                "active".equals(status.get("state"))));
                        status.put("recoveryRequired", fullBackups.recoveryRequired());''',
          )

          Path("host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCache.java").write_bytes(base64.b64decode(""))
          Path("host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCacheTest.java").write_bytes(base64.b64decode(""))
          PY
      - name: Commit remediation for normal Build CI
        shell: bash
        run: |
          git config user.name "PlexonPanel Agent"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git add host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java \
                  host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCache.java \
                  host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MinecraftReadinessCacheTest.java
          git diff --cached --check
          git commit -m "[agent-patch] Cache passive RCON readiness"
          git push origin HEAD:${GITHUB_REF_NAME}
