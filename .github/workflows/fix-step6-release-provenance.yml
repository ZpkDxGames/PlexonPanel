name: Validate Step 6 release provenance

on:
  push:
    branches: [fix/step6-release-provenance]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step6-release-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Update matched Dashboard provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_commit = "a5e99a4f23d9e65db942a27012fbe74e368579e3"
          new_commit = "54b79f98201fc56835f8ff1cca20853ce4bebc39"
          old_run = "34855843387"
          new_run = "34880343784"

          def replace_exact(path, before, after):
              p = Path(path)
              text = p.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {before!r}, found {count}")
              p.write_text(text.replace(before, after))

          replace_exact(
              "scripts/package-release.py",
              f'DASHBOARD_CANDIDATE = "{old_commit}"',
              f'DASHBOARD_CANDIDATE = "{new_commit}"',
          )
          replace_exact(
              "scripts/package-release.py",
              f"DASHBOARD_CI_RUN = {old_run}",
              f"DASHBOARD_CI_RUN = {new_run}",
          )
          replace_exact(
              ".github/workflows/build.yml",
              f"dashboard='{old_commit}'",
              f"dashboard='{new_commit}'",
          )
          replace_exact(
              ".github/workflows/build.yml",
              f"assert manifest['dashboardCiRun'] == {old_run}",
              f"assert manifest['dashboardCiRun'] == {new_run}",
          )

          gates = Path("docs/PHASE2_RUNTIME_GATES.md")
          text = gates.read_text()
          replacements = {
              "- Java/Paper/Host Step 7 merge: `57c4842a6d91827205de3f00dc0a0c35e58674c5`":
                  "- Java/Paper/Host Step 6 authorization merge: `0aae99f90aa296492a0afc1ac8add1c45320ca61` (current main at provenance refresh: `cec455117127995df7296e58f8de7c9bc7ffcd66`, which retains that merge and adds later non-authorization work)",
              f"- Dashboard/relay Step 7 merge: `{old_commit}`":
                  f"- Dashboard/relay Step 6 authorization merge: `{new_commit}`",
              f"- Dashboard post-merge CI: `{old_run}` — **PASS**":
                  f"- Dashboard post-merge CI: `{new_run}` — **PASS**",
              "- Java current-main-equivalent source-gate CI: `34856187122` — **PASS** on Ubuntu 24.04 x64 and ARM; the CI-only branch differed from Java `main` only by `docs/STEP7_CURRENT_MAIN_CI_TRIGGER.md` and was closed unmerged.":
                  "- Java Step 6 pull-request CI: `34860089290` — **PASS** on Ubuntu 24.04 x64 and ARM, including matched JAR build and release-contract packaging.",
              "Step 7 source integration is therefore repository-green but **not production-certified**.":
                  "Step 6/7 source integration is therefore repository-green but **not production-certified**.",
          }
          for before, after in replacements.items():
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"runtime gates: expected one match for {before!r}, found {count}")
              text = text.replace(before, after)
          gates.write_text(text)

          for path in ["scripts/package-release.py", ".github/workflows/build.yml", "docs/PHASE2_RUNTIME_GATES.md"]:
              text = Path(path).read_text()
              if old_commit in text or old_run in text:
                  raise SystemExit(f"stale Dashboard provenance remains in {path}")
          PY
          git diff --check

      - name: Test and package matched release contract
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean test check javadoc :agent:jar :host-agent:jar
          python3 scripts/summarize-tests.py
          python3 scripts/package-release.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('build/release/release-manifest.json').read_text())
          assert manifest['dashboardCandidateCommit'] == '54b79f98201fc56835f8ff1cca20853ce4bebc39'
          assert manifest['dashboardCiRun'] == 34880343784
          assert manifest['runtimeCertification'] == 'NOT_EXECUTED'
          assert manifest['protocolVersion'] == 3
          assert manifest['java'] == 25
          PY
          (cd build/release && sha256sum --check SHA256SUMS.txt)
          git diff --check

      - name: Commit provenance fix
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions tokens cannot publish workflow-file changes. Commit only
          # the validated non-workflow provenance files here; build.yml is updated
          # directly through the repository API after this run passes.
          git add scripts/package-release.py docs/PHASE2_RUNTIME_GATES.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Step 6 matched release provenance"
          git push origin HEAD:fix/step6-release-provenance
