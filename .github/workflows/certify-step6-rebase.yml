name: Certify Step 6 current-main integration

on:
  push:
    branches: [agent/step6-host-authorization-decoupling-final]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certify-step6-rebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Apply validated Step 6 patch onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/step6-host-authorization-decoupling
          source_ref=origin/agent/step6-host-authorization-decoupling
          base_ref=$(git merge-base origin/main "$source_ref")
          paths=(
            agent/src/main/java/io/github/zpkdxgames/plexonpanel/AgentRuntime.java
            docs/HOST_AGENT.md
            docs/HOST_AUTHORIZATION_MIRROR.md
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostAuthorizationMirror.java
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostConfig.java
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java
            host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/HostAuthorizationMirrorTest.java
            host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/HostConfigTest.java
            protocol/src/main/java/io/github/zpkdxgames/plexonpanel/security/DeviceRegistry.java
          )
          git diff --binary "$base_ref" "$source_ref" -- "${paths[@]}" > /tmp/step6.patch
          test -s /tmp/step6.patch
          git apply --3way /tmp/step6.patch
          git diff --check
          git status --short

      - name: Test and build integrated backend
        run: ./gradlew --no-daemon clean test check javadoc :agent:jar :host-agent:jar

      - name: Commit certified Step 6 integration
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            agent/src/main/java/io/github/zpkdxgames/plexonpanel/AgentRuntime.java
            docs/HOST_AGENT.md
            docs/HOST_AUTHORIZATION_MIRROR.md
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostAuthorizationMirror.java
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostConfig.java
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java
            host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/HostAuthorizationMirrorTest.java
            host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/HostConfigTest.java
            protocol/src/main/java/io/github/zpkdxgames/plexonpanel/security/DeviceRegistry.java
          )
          git add -- "${paths[@]}"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Decouple Host authorization from Paper runtime"
          git push origin HEAD:agent/step6-host-authorization-decoupling-final
