name: Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - docs/releases/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plexonpanel-release-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify and package
        run: ./gradlew --no-daemon clean test javadoc :agent:jar releaseBundle

      - name: Create checksums
        run: |
          sha256sum \
            agent/build/libs/PlexonPanel-0.1.0.jar \
            build/distributions/PlexonPanel-0.1.0-release.zip \
            > build/distributions/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              agent/build/libs/PlexonPanel-0.1.0.jar \
              build/distributions/PlexonPanel-0.1.0-release.zip \
              build/distributions/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              agent/build/libs/PlexonPanel-0.1.0.jar \
              build/distributions/PlexonPanel-0.1.0-release.zip \
              build/distributions/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "PlexonPanel 0.1.0" \
              --notes-file docs/releases/v0.1.0.md
          fi
