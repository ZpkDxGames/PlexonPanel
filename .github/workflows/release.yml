name: Prepare gated draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag (v2.0.0)
        required: true
        type: string
      acceptance_verified:
        description: All live Paper, ARM64, cloud, rclone and stability evidence was reviewed
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: plexonpanel-release
  cancel-in-progress: false
jobs:
  draft:
    if: inputs.acceptance_verified && inputs.tag == 'v2.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Require recorded acceptance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          gates=json.loads(Path('docs/release-gates.json').read_text())
          required={'paperDisposable','ubuntuArm64','cloudflareVercel','rclone','restoreCrashRecovery','stability30Minutes'}
          assert gates['version']=='2.0.0' and set(gates['gates'])==required
          assert all(g['passed'] is True and g['evidence'].strip() for g in gates['gates'].values()), 'Live acceptance is incomplete'
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon clean test javadoc :agent:jar :host-agent:jar
      - run: python3 scripts/package-release.py
      - name: Create draft for final operator review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" build/release/* --verify-tag --draft \
            --title "PlexonPanel 2.0.0" --notes-file CHANGELOG.md
