name: Prepare gated final release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag (v3.1.0)
        required: true
        type: string
      acceptance_verified:
        description: All live Core, lifecycle, compatibility, Paper, ARM64, cloud, rclone, privacy and stability evidence was reviewed
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: plexonpanel-release
  cancel-in-progress: false
jobs:
  draft:
    if: inputs.acceptance_verified && inputs.tag == 'v3.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Require recorded acceptance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          gates=json.loads(Path('docs/release-gates.json').read_text())
          required={
            'paperDisposable','fullCapabilityAccessMatrix','highRiskConfirmationAudit',
            'ubuntuArm64','cloudflareVercel','rclone','restoreCrashRecovery',
            'stability30Minutes','playerPresenceLifecycle','orphanSessionRecovery',
            'mixedVersionProtocol3','realtimeReconciliation','privacyScopeValidation',
            'coreModuleRegistration','coreReloadNoTransportRestart','standaloneWithoutCore',
            'panelLifecycleTwentyCycles'
          }
          assert gates['version']=='3.1.0' and set(gates['gates'])==required
          assert all(g['passed'] is True and g['evidence'].strip() for g in gates['gates'].values()), 'Live acceptance is incomplete'
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=1.0.0 -Dpackaging=jar -DgeneratePom=true
      - run: ./gradlew --no-daemon clean test check javadoc :agent:jar :host-agent:jar
      - run: python3 scripts/package-release.py
      - name: Create draft for final operator review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" build/release/* --verify-tag --draft \
            --title "PlexonPanel 3.1.0" --notes-file CHANGELOG.md
