name: Publish requested 2.0.0 prerelease
on:
  push:
    branches: [release/2.0.0-rc.1-assets]
    paths: [.github/workflows/publish-2.0.0-rc.1.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: plexonpanel-prerelease-2.0.0-rc.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ZpkDxGames/PlexonPanel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ZpkDxGames/PlexonPanel
      SOURCE_SHA: 0342dc3ccb3c3bdf72db90071abfe06d6c4b3334
      BUILD_RUN_ID: "33999337727"
      RELEASE_TAG: v2.0.0-rc.1
    steps:
      # Requested distribution of the tested JARs. Production acceptance remains pending.
      - name: Verify the successful source build and unused release tag
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GH_REPO"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"]))
          run = api("actions/runs/" + os.environ["BUILD_RUN_ID"])
          assert run["head_sha"] == os.environ["SOURCE_SHA"]
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["event"] == "push" and run["path"] == ".github/workflows/build.yml"
          assert run["head_branch"] == "agent/2.0-control-room"
          jobs = api("actions/runs/" + os.environ["BUILD_RUN_ID"] + "/jobs")["jobs"]
          assert len(jobs) == 2 and all(job["conclusion"] == "success" for job in jobs)
          releases = api("releases?per_page=100")
          assert not any(r["tag_name"] == os.environ["RELEASE_TAG"] for r in releases), "Release already exists; refusing to overwrite"
          refs = api("git/matching-refs/tags/" + os.environ["RELEASE_TAG"])
          assert not any(r["ref"] == "refs/tags/" + os.environ["RELEASE_TAG"] for r in refs), "Tag already exists; refusing to overwrite"
          print("Verified source commit, successful x64/ARM64 jobs, and unused prerelease tag.")
          PY
      - name: Check out the exact tested source
        uses: actions/checkout@v7
        with:
          ref: 0342dc3ccb3c3bdf72db90071abfe06d6c4b3334
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Reproduce the packaged artifacts from the tested source
        run: |
          ./gradlew --no-daemon :agent:jar :host-agent:jar
          python3 scripts/package-release.py
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          status = subprocess.check_output(["git", "status", "--porcelain", "-z"]).split(b"\0")
          entries = [entry for entry in status if entry]
          # The baseline committed CRLF bytes for this wrapper; Git's clean filter flags it.
          assert entries in ([], [b" M gradlew.bat"]), entries
          assert Path("gradlew.bat").read_bytes() == subprocess.check_output(["git", "show", "HEAD:gradlew.bat"])
          print("All tracked source bytes verified; Windows wrapper line-ending status is explained.")
          PY
      - name: Download the exact tested artifacts
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GH_REPO" \
            --name "PlexonPanel-2.0.0-ubuntu-24.04" --dir release-assets
      - name: Verify checksums, source manifest, and both JARs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path("release-assets")
          expected = {"PlexonPanel-2.0.0.jar", "plexonpanel-host-2.0.0.jar", "PlexonPanel-2.0.0-examples.zip", "release-manifest.json", "SHA256SUMS.txt"}
          assert {p.name for p in root.iterdir()} == expected
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          manifest = json.loads((root / "release-manifest.json").read_text())
          assert manifest["sourceCommit"] == os.environ["SOURCE_SHA"]
          assert isinstance(manifest["workingTreeModified"], bool)
          for name in expected:
              assert (root / name).read_bytes() == (Path("build/release") / name).read_bytes(), "Fresh build differs: " + name
          print("All five release assets match the fresh source build byte for byte.")
          assert manifest["version"] == "2.0.0" and manifest["protocolVersion"] == 3 and manifest["java"] == 25
          checked = set()
          for line in (root / "SHA256SUMS.txt").read_text().splitlines():
              digest, name = line.split("  ")
              assert name in expected - {"SHA256SUMS.txt"} and name not in checked
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
              checked.add(name)
          assert checked == expected - {"SHA256SUMS.txt"}
          for name in sorted(expected):
              path = root / name
              if name.endswith((".jar", ".zip")):
                  with zipfile.ZipFile(path) as archive:
                      assert archive.testzip() is None
                      if name == "PlexonPanel-2.0.0.jar":
                          descriptor = archive.read("plugin.yml").decode()
                          versions = [line.split(":", 1)[1].strip().strip("'\"") for line in descriptor.splitlines() if line.startswith("version:")]
                          assert versions == ["2.0.0"]
                      elif name == "plexonpanel-host-2.0.0.jar":
                          assert "Main-Class:" in archive.read("META-INF/MANIFEST.MF").decode()
              print(name, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Prepare installation and validation notes
        run: |
          cat > release-notes.md <<'NOTES'
          PlexonPanel 2.0.0 release candidate for **Paper 26.2 and Java 25**.

          This prerelease makes the tested 2.0.0 JARs available for staging and live acceptance testing. The JARs report product version 2.0.0; rc.1 identifies this prerelease distribution.

          ### Downloads and installation

          - **PlexonPanel-2.0.0.jar** — the Paper plugin. Stop the server, replace the previous PlexonPanel JAR in the plugins folder, and start the server.
          - **plexonpanel-host-2.0.0.jar** — optional independent Linux host companion for configured service lifecycle, backups, and restore. Run it separately with Java 25; do not put it in Paper's plugins folder.
          - **PlexonPanel-2.0.0-examples.zip** — example plugin and host configuration, systemd/polkit examples, and installation/operations documentation.
          - **SHA256SUMS.txt** and **release-manifest.json** — file integrity checks and exact build provenance.

          Back up the current plugin configuration and server data before upgrading. Review the included installation and migration guides. Remote actions, file writes, host lifecycle, and backups are disabled by default and require explicit local configuration.

          ### Included in 2.0

          - Expanded telemetry and a coordinated 12-section dashboard control room.
          - Device pairing, scoped roles, local capability enforcement, revocation, and audited actions.
          - Player moderation, bounded console/chat controls, plugin inspection, and protected file access.
          - Independent host lifecycle, bounded backups, save leases, and staged restore recovery.
          - Signed protocol v3 sessions, replay protection, and bounded queues.

          ### Dashboard compatibility

          Use the matching **2.0.0 dashboard and relay with protocol v3** from the agent/2.0-control-room branch. The old v2 relay/dashboard is incompatible. Existing unscoped grants require pairing again; retain the server identity files. This release uploads Java artifacts only and does not deploy the dashboard or relay.

          ### Validation and remaining acceptance

          The attached files are the exact artifacts from [successful x64 and ARM64 CI](https://github.com/ZpkDxGames/PlexonPanel/actions/runs/33999337727), built from commit 0342dc3ccb3c3bdf72db90071abfe06d6c4b3334. Java tests, Javadoc, and packaging passed on both runners. The matching dashboard/relay checks also passed.

          The release job also rebuilt the same source and verified byte-for-byte matches for both JARs, examples, checksums, and the source manifest. The manifest records workingTreeModified=true because the baseline Windows wrapper has stored CRLF line endings; its bytes were verified against Git, with no other source changes.

          **Production acceptance is pending:** live Paper and Ubuntu host operation, deployed Cloudflare/Vercel pairing, real rclone transfers, interrupted-restore recovery, and a 30-minute stability run. See [the acceptance guide](https://github.com/ZpkDxGames/PlexonPanel/blob/0342dc3ccb3c3bdf72db90071abfe06d6c4b3334/docs/VALIDATION.md).

          No stable 2.0.0 release or main-branch merge is included in this prerelease.
          NOTES
      - name: Publish requested prerelease with verified assets
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GH_REPO" --target "$SOURCE_SHA" \
            --prerelease --latest=false --title "PlexonPanel 2.0.0-rc.1" \
            --notes-file release-notes.md
      - name: Verify uploaded assets and source tag
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          repo, tag = os.environ["GH_REPO"], os.environ["RELEASE_TAG"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"]))
          release = api("releases/tags/" + tag)
          assert release["prerelease"] is True and release["draft"] is False
          assets = {a["name"]: a for a in release["assets"]}
          files = list(Path("release-assets").iterdir())
          assert set(assets) == {p.name for p in files}
          for path in files:
              asset = assets[path.name]
              assert asset["state"] == "uploaded" and asset["size"] == path.stat().st_size
              assert asset["digest"] == "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              print(asset["browser_download_url"])
          ref = api("git/ref/tags/" + tag)
          assert ref["object"]["type"] == "commit" and ref["object"]["sha"] == os.environ["SOURCE_SHA"]
          print("Published and verified:", release["html_url"])
          PY
