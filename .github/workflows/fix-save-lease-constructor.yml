name: Fix Save Lease Constructor

on:
  push:
    branches:
      - agent/3.4.1-backup-reliability

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[save-lease-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/3.4.1-backup-reliability
      - name: Restore registry-backed lease constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java')
          text = path.read_text()
          old = 'PaperSaveLease leases = new PaperSaveLease(connection);'
          new = 'PaperSaveLease leases = new PaperSaveLease(connection, devices);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one constructor call, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java
          git commit -m "Restore registry-backed save lease constructor [save-lease-fixed]"
          git push origin HEAD:agent/3.4.1-backup-reliability
