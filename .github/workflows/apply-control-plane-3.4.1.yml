name: Apply Host Control Plane 3.4.1 Patch

on:
  push:
    branches:
      - agent/3.4.1-backup-reliability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[control-plane-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/3.4.1-backup-reliability
          fetch-depth: 0
      - name: Apply Host control-plane patch
        run: python3 scripts/apply-control-plane-3.4.1.py
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build.gradle.kts \
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostConfig.java \
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/BackupPreflight.java \
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/RcloneBackupProvider.java \
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java
          git commit -m "Wire backup preflight and provider runtime truth [control-plane-patched]"
          git push origin HEAD:agent/3.4.1-backup-reliability
