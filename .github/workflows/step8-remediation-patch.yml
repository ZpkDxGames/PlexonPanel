name: Step 8 remediation patch

on:
  push:
    branches:
      - agent/step8-fail-closed-local-backup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step8-fail-closed-local-backup
          fetch-depth: 0

      - name: Apply fail-closed maintenance remediation
        run: python3 scripts/step8-remediation-patch.py

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/build.yml \
            protocol/src/main/java/io/github/zpkdxgames/plexonpanel/security/Scopes.java \
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/HostMain.java \
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceManager.java \
            host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceStateStore.java \
            host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceFullBackupFailurePolicyTest.java \
            host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceStateStoreTest.java \
            scripts/test-backup-read-bridge.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[step8-remediation-applied] Harden backup recovery and bridge CI"
          git push origin HEAD:agent/step8-fail-closed-local-backup
