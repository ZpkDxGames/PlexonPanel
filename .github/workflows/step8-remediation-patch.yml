name: Step 8 remediation patch

on:
  push:
    branches:
      - agent/step8-fail-closed-local-backup

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[step8-remediation-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step8-fail-closed-local-backup
          fetch-depth: 0

      - name: Apply fail-closed maintenance remediation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceManager.java')
          text = path.read_text()

          old = '''      boolean destructiveBoundary = stoppedByUs || stopBoundaryEntered.get();
                fail(job, device, automatic, "backup.full.create", error, destructiveBoundary);
                if (destructiveBoundary) tryStartAfterFailure();'''
          new = '''      boolean destructiveBoundary = stoppedByUs || stopBoundaryEntered.get();
                fail(job, device, automatic, "backup.full.create", error, destructiveBoundary);
                if (shouldStartAfterFullBackupFailure(destructiveBoundary, job.localBackupVerified()))
                  tryStartAfterFailure();'''
          if old not in text:
              raise SystemExit('full-backup failure block not found')
          text = text.replace(old, new, 1)

          marker = '''  private void tryStartAfterFailure() {
            try {
              if (service.stopped()) service.action("start");
            } catch (Exception startFailure) {
              System.err.println("PlexonPanel Host could not recover server start after maintenance failure");
            }
          }
          '''
          replacement = '''  static boolean shouldStartAfterFullBackupFailure(
              boolean destructiveBoundary, boolean localBackupVerified) {
            return destructiveBoundary && localBackupVerified;
          }

          private void tryStartAfterFailure() {
            try {
              if (service.stopped()) service.action("start");
            } catch (Exception startFailure) {
              System.err.println("PlexonPanel Host could not recover server start after maintenance failure");
            }
          }
          '''
          if marker not in text:
              raise SystemExit('recovery-start method marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          test = Path('host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceFullBackupFailurePolicyTest.java')
          test.write_text('''package io.github.zpkdxgames.plexonpanel.host;\n\nimport static org.junit.jupiter.api.Assertions.*;\n\nimport org.junit.jupiter.api.Test;\n\nclass MaintenanceFullBackupFailurePolicyTest {\n  @Test\n  void archiveFailureBeforeLocalVerificationFailsClosed() {\n    assertFalse(MaintenanceManager.shouldStartAfterFullBackupFailure(true, false));\n  }\n\n  @Test\n  void preDestructiveFailureNeverStartsService() {\n    assertFalse(MaintenanceManager.shouldStartAfterFullBackupFailure(false, false));\n    assertFalse(MaintenanceManager.shouldStartAfterFullBackupFailure(false, true));\n  }\n\n  @Test\n  void verifiedLocalBackupMayRecoverServiceAvailability() {\n    assertTrue(MaintenanceManager.shouldStartAfterFullBackupFailure(true, true));\n  }\n}\n''')
          PY

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceManager.java \
                  host-agent/src/test/java/io/github/zpkdxgames/plexonpanel/host/MaintenanceFullBackupFailurePolicyTest.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[step8-remediation-applied] Fail closed before local backup verification"
          git push origin HEAD:agent/step8-fail-closed-local-backup
