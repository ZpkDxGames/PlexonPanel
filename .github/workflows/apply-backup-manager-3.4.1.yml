name: Apply BackupManager 3.4.1 Patch

on:
  push:
    branches:
      - agent/3.4.1-backup-reliability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[backup-manager-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/3.4.1-backup-reliability
          fetch-depth: 0
      - name: Apply bounded live-snapshot patch
        run: python3 scripts/apply-backup-manager-3.4.1.py
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host-agent/src/main/java/io/github/zpkdxgames/plexonpanel/host/BackupManager.java
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "Harden live snapshot creation [backup-manager-patched]"
          git push origin HEAD:agent/3.4.1-backup-reliability
