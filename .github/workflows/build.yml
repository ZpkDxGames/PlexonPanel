name: Build
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon clean test javadoc :agent:jar :host-agent:jar
      - name: Package and verify clean provenance
        run: |
          python3 scripts/package-release.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path('build/release/release-manifest.json').read_text())
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
          assert manifest['workingTreeModified'] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: PlexonPanel-3.0.2-${{ matrix.os }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
