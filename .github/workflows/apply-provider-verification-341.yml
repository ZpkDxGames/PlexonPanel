name: Apply provider verification 341

on:
  push:
    branches:
      - agent/3.4.1-backup-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/3.4.1-backup-reliability
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply provider verification patch
        run: python3 scripts/apply-provider-verification-341.py
      - name: Verify Host provider contract
        run: ./gradlew --no-daemon :host-agent:test
      - name: Commit verified source
        run: |
          rm .github/workflows/apply-provider-verification-341.yml
          rm scripts/apply-provider-verification-341.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Track last successful provider verification"
          git push origin HEAD:agent/3.4.1-backup-reliability
