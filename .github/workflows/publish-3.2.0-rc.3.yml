name: Publish 3.2.0-rc.3 prerelease
on:
  push:
    branches: ["phase3/runtime-reliability"]
permissions:
  actions: read
  contents: write
  pull-requests: read
concurrency:
  group: plexonpanel-3.2.0-rc.3-release
  cancel-in-progress: false
env:
  RELEASE_TAG: v3.2.0-rc.3
  VERSION: 3.2.0-rc.3
  BASE_SHA: 7dc266478d9af23963a982b219bda1fbfe75f0a9
  ACCEPTED_INTEGRATION_SHA: c05d23bbea3786b192c329d49e516d50d143929c
  CHATS_SHA: 48a32861892a5d28445b780ee234d7fc0e732d0c
  RC2_SHA: 7dc266478d9af23963a982b219bda1fbfe75f0a9
  DASHBOARD_SHA: bb2c1d76f38ce9ce49aa7f3ece278cc0df2d02f2
  DASHBOARD_CI_RUN: "34524470086"
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require exact RC3 release metadata and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_SHA" "$GITHUB_SHA")" = "$BASE_SHA"
          git merge-base --is-ancestor "$ACCEPTED_INTEGRATION_SHA" "$GITHUB_SHA"
          grep -F 'version = "3.2.0-rc.3"' build.gradle.kts
          grep -F 'version: "3.2.0-rc.3"' agent/src/main/resources/plugin.yml
          grep -F "$ACCEPTED_INTEGRATION_SHA" docs/release-3.2.0-rc.3.md
          grep -F "$CHATS_SHA" docs/release-3.2.0-rc.3.md
          grep -F 'runtimeCertification' scripts/package-release.py
          unexpected="$(git diff --name-only "$ACCEPTED_INTEGRATION_SHA..$GITHUB_SHA" | grep -Ev '^(build.gradle.kts|agent/src/main/resources/plugin.yml|\.github/workflows/build.yml|\.github/workflows/publish-3\.2\.0-rc\.3\.yml|docs/release-3\.2\.0-rc\.3\.md|protocol/src/test/java/io/github/zpkdxgames/plexonpanel/protocol/ReleaseVersionConsistencyTest\.java)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Non-release-preparation changes found after accepted integration commit:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Wait for exact-head source and PR Build CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            push_state="$(jq -r '[.workflow_runs[] | select(.name=="Build" and .event=="push")][0] | if .==null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
            pr_state="$(jq -r '[.workflow_runs[] | select(.name=="Build" and .event=="pull_request")][0] | if .==null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
            echo "Build source=${push_state} pr=${pr_state}"
            if [[ "$push_state" == "completed:success" && "$pr_state" == "completed:success" ]]; then
              ok=true
              break
            fi
            if [[ "$push_state" == completed:* && "$push_state" != "completed:success" ]]; then exit 1; fi
            if [[ "$pr_state" == completed:* && "$pr_state" != "completed:success" ]]; then exit 1; fi
            sleep 10
          done
          test "$ok" = true
      - name: Verify draft PR and frozen compatibility boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/17")"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .draft <<<"$pr")" = true
          test "$(jq -r .head.ref <<<"$pr")" = phase3/runtime-reliability
          test "$(jq -r .head.sha <<<"$pr")" = "$GITHUB_SHA"
          test "$(jq -r .base.ref <<<"$pr")" = phase2/3.2.0-control-plane
          test "$(jq -r .base.sha <<<"$pr")" = "$BASE_SHA"

          chats_ref="$(curl -fsSL https://api.github.com/repos/ZpkDxGames/PlexonChats/git/ref/heads/phase3/feature-consolidation | jq -r .object.sha)"
          test "$chats_ref" = "$CHATS_SHA"

          dashboard_run="$(curl -fsSL "https://api.github.com/repos/ZpkDxGames/PlexonPanel-Dashboard/actions/runs/${DASHBOARD_CI_RUN}")"
          test "$(jq -r .head_sha <<<"$dashboard_run")" = "$DASHBOARD_SHA"
          test "$(jq -r .status <<<"$dashboard_run")" = completed
          test "$(jq -r .conclusion <<<"$dashboard_run")" = success
      - name: Preserve RC2 and require stable absence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rc2="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.2.0-rc.2")"
          test "$(jq -r .target_commitish <<<"$rc2")" = "$RC2_SHA"
          test "$(jq -r .prerelease <<<"$rc2")" = true
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.2.0-rc.2" --jq .object.sha)" = "$RC2_SHA"
          if gh release view v3.2.0 >/dev/null 2>&1; then
            echo "Stable v3.2.0 already exists; refusing RC publication." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v3.2.0 >/dev/null 2>&1; then
            echo "Stable v3.2.0 tag already exists; refusing RC publication." >&2
            exit 1
          fi
  release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or verify immutable RC3 tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_SHA" "$GITHUB_SHA")" = "$BASE_SHA"
          git merge-base --is-ancestor "$ACCEPTED_INTEGRATION_SHA" "$GITHUB_SHA"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          git checkout --detach "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Rebuild and test exact tag
        run: ./gradlew --no-daemon clean test check javadoc :agent:jar :host-agent:jar
      - name: Package and verify exact-tag RC3 release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/summarize-tests.py
          python3 scripts/package-release.py
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          version=os.environ['VERSION']
          dashboard=os.environ['DASHBOARD_SHA']
          manifest=json.loads(Path('build/release/release-manifest.json').read_text())
          assert manifest['version'] == version
          assert manifest['protocolVersion'] == 3
          assert manifest['java'] == 25
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
          assert manifest['javaCandidateCommit'] == os.environ['GITHUB_SHA']
          assert manifest['dashboardCandidateCommit'] == dashboard
          assert manifest['dashboardCiRun'] == int(os.environ['DASHBOARD_CI_RUN'])
          assert manifest['runtimeCertification'] == 'NOT_EXECUTED'
          assert manifest['workingTreeModified'] is False
          jar=Path(f'build/release/PlexonPanel-{version}.jar')
          host=Path(f'build/release/plexonpanel-host-{version}.jar')
          def major(path, entry):
              with zipfile.ZipFile(path) as z: data=z.read(entry)
              assert data[:4] == b'\xca\xfe\xba\xbe'
              return int.from_bytes(data[6:8], 'big')
          assert major(jar, 'io/github/zpkdxgames/plexonpanel/PlexonPanelPlugin.class') == 69
          assert major(host, 'io/github/zpkdxgames/plexonpanel/host/HostMain.class') == 69
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              plugin_yml=z.read('plugin.yml').decode('utf-8')
          assert not any(name.startswith('com/zpkdxgames/plexoncore/') for name in names)
          assert f'version: "{version}"' in plugin_yml
          PY
          (cd build/release && sha256sum --check SHA256SUMS.txt)
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
            test "$(jq -r .target_commitish <<<"$release")" = "$GITHUB_SHA"
            test "$(jq -r .prerelease <<<"$release")" = true
          else
            gh release create "$RELEASE_TAG" build/release/* \
              --verify-tag --target "$GITHUB_SHA" --prerelease \
              --title "PlexonPanel 3.2.0-rc.3" \
              --notes-file docs/release-3.2.0-rc.3.md
          fi
      - name: Independently verify published RC3 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-verify
          mkdir release-verify
          gh release download "$RELEASE_TAG" --dir release-verify
          for required in \
            "PlexonPanel-${VERSION}.jar" \
            "plexonpanel-host-${VERSION}.jar" \
            "PlexonPanel-${VERSION}-examples.zip" \
            SHA256SUMS.txt release-manifest.json test-summary.txt; do
            test -f "release-verify/$required"
            cmp "build/release/$required" "release-verify/$required"
          done
          cd release-verify
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          version=os.environ['VERSION']
          jar=Path(f'PlexonPanel-{version}.jar')
          host=Path(f'plexonpanel-host-{version}.jar')
          manifest=json.loads(Path('release-manifest.json').read_text())
          assert manifest['version'] == version
          assert manifest['protocolVersion'] == 3
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
          assert manifest['javaCandidateCommit'] == os.environ['GITHUB_SHA']
          assert manifest['dashboardCandidateCommit'] == os.environ['DASHBOARD_SHA']
          assert manifest['runtimeCertification'] == 'NOT_EXECUTED'
          def major(path, entry):
              with zipfile.ZipFile(path) as z: data=z.read(entry)
              return int.from_bytes(data[6:8], 'big')
          assert major(jar, 'io/github/zpkdxgames/plexonpanel/PlexonPanelPlugin.class') == 69
          assert major(host, 'io/github/zpkdxgames/plexonpanel/host/HostMain.class') == 69
          with zipfile.ZipFile(jar) as z: names=set(z.namelist())
          assert not any(name.startswith('com/zpkdxgames/plexoncore/') for name in names)
          print(f'plugin_size={jar.stat().st_size}')
          print(f'plugin_sha256={hashlib.sha256(jar.read_bytes()).hexdigest()}')
          print(f'host_size={host.stat().st_size}')
          print(f'host_sha256={hashlib.sha256(host.read_bytes()).hexdigest()}')
          print(Path('test-summary.txt').read_text(), end='')
          PY
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r .target_commitish <<<"$release")" = "$GITHUB_SHA"
          test "$(jq -r .prerelease <<<"$release")" = true
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.2.0-rc.2" --jq .object.sha)" = "$RC2_SHA"
          if gh release view v3.2.0 >/dev/null 2>&1; then exit 1; fi
