# PlexonPanel 3.0.2 — PlexonCraft full local Paper capability preset
#
# This file intentionally enables every capability that the Paper agent can
# truthfully execute. Backup, provider, maintenance and systemd lifecycle authority
# belongs exclusively to the Linux Host Companion.

gateway:
  enabled: false
  url: ""
  public-key: ""
  require-signed-messages: true
  connect-timeout-seconds: 10
  heartbeat-seconds: 15
  reconnect:
    initial-delay-seconds: 2
    maximum-delay-seconds: 60
  queue-capacity: 256

telemetry:
  enabled: true
  server-interval-ticks: 5
  player-snapshot-interval-seconds: 30
  system-interval-seconds: 1
  world-interval-seconds: 10
  plugin-interval-seconds: 60
  send-player-presence-events: true
  suppress-unchanged-inventories: true
  include-player-location: true
  include-player-address: true

player-history:
  enabled: true
  retention-days: 30
  maximum-events: 100000
  maximum-player-summaries: 50000
  maximum-journal-file-bytes: 8388608
  query-byte-budget: 33554432
  default-page-size: 50
  maximum-page-size: 100
  shutdown-flush-seconds: 5

# Server-console capture/history is intentionally absent from Paper. The Host owns history;
# Paper keeps only redaction rules for Paper-owned command results.
console:
  redact-patterns:
    - "(?i)(password|passwd|secret|token|api[-_ ]?key)\\s*[=:]\\s*\\S+"
    - "(?i)(authorization:\\s*bearer)\\s+\\S+"

chat:
  stream-enabled: true
  capture-vanilla-global: true
  capture-plexonchats-global: true
  allow-dashboard-send: true
  allow-minimessage-from-dashboard: true
  dashboard-prefix: "<dark_gray>[</dark_gray><gradient:#7c3aed:#22d3ee>PlexonPanel</gradient><dark_gray>]</dark_gray> <gray><actor>:</gray> "

remote-actions:
  enabled: true
  maximum-clock-skew-seconds: 30
  console:
    enabled: true
    mode: ALLOWLIST_WITH_CONFIRMATION
    allow:
      - "^(tps|mspt)(\\s.*)?$"
      - "^paper version$"
      - "^spark (health|tps)(\\s.*)?$"
      - "^plexonpanel reload$"
    deny:
      - "^(stop|restart|reload|op|deop)(\\s.*)?$"
      - "^(lp|luckperms|pex)(\\s.*)?$"
      - ".*(password|secret|token|api[-_]?key).*"
  players:
    message: true
    kick: true
    ban: true
    unban: true
    whitelist: true
    teleport: true
    gamemode: true
    heal: true
    feed: true
    kill: true
    op: true
  plugin-reload-commands:
    PlexonPanel: "plexonpanel reload"

audit:
  retention-days: 30

access:
  default-pair-role: Owner
  device-credential-days: 30
  allow-dashboard-revoke: true
  roles: {}

files:
  enabled: true
  roots:
    server:
      path: /opt/plexoncraft/server
      read: true
      write: true
  permissions:
    list: true
    read: true
    download: true
    write: true
    create: true
    rename: true
    delete: true
    upload: true

host:
  public-key: "" # Host trust identity only; Paper does not coordinate backups.
