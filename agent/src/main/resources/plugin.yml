name: PlexonPanel
version: "3.2.0-rc.3"
main: io.github.zpkdxgames.plexonpanel.PlexonPanelPlugin
description: Secure Paper server monitoring and remote administration agent for PlexonPanel.
api-version: "26.2"
author: ZpkDxGames
website: https://github.com/ZpkDxGames/PlexonPanel
softdepend:
  - PlexonCore
  - PlexonChats

commands:
  plexonpanel:
    description: Manage the PlexonPanel server agent.
    usage: /<command> [gui|status|pair [role]|devices|revoke|revoke-all|capabilities|audit|unpair|rotate|reload|diagnostics]
    aliases: [ppanel]

permissions:
  plexonpanel.admin:
    description: Grants access to all PlexonPanel administrative commands.
    default: op
    children:
      plexonpanel.gui: true
      plexonpanel.devices: true
      plexonpanel.revoke: true
      plexonpanel.capabilities: true
      plexonpanel.audit: true
      plexonpanel.status: true
      plexonpanel.pair: true
      plexonpanel.unpair: true
      plexonpanel.rotate: true
      plexonpanel.reload: true
      plexonpanel.diagnostics: true
  plexonpanel.status:
    default: op
  plexonpanel.pair:
    default: op
  plexonpanel.unpair:
    default: op
  plexonpanel.rotate:
    default: op
  plexonpanel.reload:
    default: op
  plexonpanel.diagnostics:
    default: op
  plexonpanel.gui:
    default: op
  plexonpanel.devices:
    default: op
  plexonpanel.revoke:
    default: op
  plexonpanel.capabilities:
    default: op
  plexonpanel.audit:
    default: op
