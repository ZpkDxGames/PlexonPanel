# PlexonPanel 2.0.0 — local policy is authoritative
# The database-less relay is disabled until its URL and public key are configured.

gateway:
  enabled: false
  # Production example: wss://YOUR-RELAY.workers.dev/v1/agent
  url: ""
  # Base64-encoded X.509 Ed25519 public key used to verify every privileged
  # message from the relay. An enabled connection is rejected when this is empty.
  public-key: ""
  require-signed-messages: true
  connect-timeout-seconds: 10
  heartbeat-seconds: 15
  reconnect:
    initial-delay-seconds: 2
    maximum-delay-seconds: 60
  queue-capacity: 256

telemetry:
  enabled: true
  server-interval-ticks: 100
  system-interval-seconds: 10
  plugin-interval-seconds: 60
  include-player-location: false
  include-player-address: false

console:
  stream-enabled: false
  errors-enabled: true
  poll-interval-millis: 250
  batch-interval-millis: 300
  batch-size: 100
  ring-buffer-lines: 1000
  maximum-line-bytes: 16384
  redact-patterns:
    - "(?i)(password|passwd|secret|token|api[-_ ]?key)\\s*[=:]\\s*\\S+"
    - "(?i)(authorization:\\s*bearer)\\s+\\S+"

chat:
  stream-enabled: false
  capture-vanilla-global: true
  capture-plexonchats-global: true
  allow-dashboard-send: false
  allow-minimessage-from-dashboard: false
  dashboard-prefix: "<dark_gray>[</dark_gray><gradient:#7c3aed:#22d3ee>PlexonPanel</gradient><dark_gray>]</dark_gray> <gray><actor>:</gray> "

remote-actions:
  enabled: false
  maximum-clock-skew-seconds: 30
  console:
    enabled: false
    mode: ALLOWLIST_WITH_CONFIRMATION
    # A command must match an allow rule and must not match a deny rule.
    allow:
      - "^(tps|mspt)(\\s.*)?$"
      - "^paper version$"
      - "^spark (health|tps)(\\s.*)?$"
    deny:
      - "^(stop|restart|reload|op|deop)(\\s.*)?$"
      - "^(lp|luckperms|pex)(\\s.*)?$"
      - ".*(password|secret|token|api[-_]?key).*"
  players:
    message: false
    kick: false
    ban: false
    unban: false
    whitelist: false
    teleport: false
    gamemode: false
    heal: false
    feed: false
    kill: false
    op: false # Also deop; requires Owner.
  plugin-reload-commands: {}

audit:
  # Security auditing is mandatory in 2.0, regardless of the old enabled switch.
  retention-days: 30

access:
  default-pair-role: Observer
  device-credential-days: 30 # 1–30; codes last five minutes and are single use.
  allow-dashboard-revoke: false
  roles: {} # Custom role: Name: {scopes: [overview.view, telemetry.view]}

files:
  enabled: false
  roots:
    server:
      path: /opt/plexoncraft/server
      read: true
      write: false
  permissions:
    list: true
    read: true
    download: true
    write: false
    create: false
    rename: false
    delete: false
    upload: false

host:
  public-key: "" # Independent host public key; never a private key.

backups:
  enabled: false # Authorize Paper save/flush leases for the optional host.
  allow-host-schedule: false
